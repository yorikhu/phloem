# ============================================================
# Lite override — Infinity only, reduces memory to ~8GB
#
# Usage:
#   DOC_ENGINE=infinity docker compose -f docker-compose.yml up -d --wait
#   (No need for -f docker-compose.lite.yml — infra services are
#    already gated behind profiles:[infinity] in the base file)
#
# This file remains for explicit memory-limit overrides and
# future per-profile tweaks.
# ============================================================

services:
  infinity:
    deploy:
      resources:
        limits:
          memory: 8G

  ragflow-server:
    deploy:
      resources:
        limits:
          memory: 4G
