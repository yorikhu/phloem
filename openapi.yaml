        question:
          type: string
          minLength: 1
          maxLength: 4000
        session_id:
          type: string
        dataset_ids:
          type: array
          items:
            type: string
        model:
          type: string
        stream:
          type: boolean
          default: true

    ChatMessage:
      type: object
      required: [id, sessionId, role, content, createdAt]
      properties:
        id:
