openapi: 3.1.0
info:
  title: Phloem API
  description: |
    Phloem is an open-source, self-hosted knowledge base platform built on RAGFlow.
    This is the single source of truth for all API contracts — frontend, gateway, MCP server,
    and tests all consume this specification.

    All responses follow a unified wrapper format:
    ```json
    {
      "code": 0,
      "data": {...},
      "request_id": "uuid",
      "timestamp": "ISO8601"
    }
    ```
  version: 0.1.0
  license:
    name: Apache-2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Phytul
    url: https://github.com/phytul/phloem

servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: /api/v1
    description: Same-origin (production)

tags:
  - name: Health
    description: Service health and readiness
  - name: Datasets
    description: Knowledge base dataset management
  - name: Documents
    description: Document upload and management
  - name: Chunks
    description: Document chunk (text slice) operations
  - name: Retrieval
    description: Knowledge retrieval and search
  - name: Chat
    description: Chat sessions and streaming completions
  - name: API Keys
    description: API key management
  - name: Account
    description: Current user account
  - name: Team
    description: Team member management
  - name: Providers
    description: LLM provider configuration
  - name: Sources
    description: External data source sync
  - name: Channels
    description: Multi-channel deployment
  - name: Usage
    description: Usage statistics and quota

paths:
  # ── Health ───────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns service health status and which adapter is active (mock or ragflow)
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_HealthStatus'

  # ── Datasets ──────────────────────────────────────────────────────────────
  /datasets:
    get:
      tags: [Datasets]
      summary: List datasets
      operationId: listDatasets
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse_DatasetListResponse'
    post:
      tags: [Datasets]
      summary: Create a dataset
      operationId: createDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCreate'
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse_Dataset'

  /datasets/{datasetId}:
    get:
      tags: [Datasets]
      summary: Get dataset by ID
      operationId: getDataset
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse_Dataset'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Datasets]
      summary: Delete dataset
      operationId: deleteDataset
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      responses:
        '204':
          description: Dataset deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Documents ──────────────────────────────────────────────────────────────
  /datasets/{datasetId}/documents:
    get:
      tags: [Documents]
      summary: List documents in a dataset
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse_DocumentListResponse'
    post:
      tags: [Documents]
      summary: Upload a document to a dataset
      operationId: uploadDocument
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse_Document'
        '400':
          $ref: '#/components/responses/BadRequest'

  /datasets/{datasetId}/documents/{documentId}:
    get:
      tags: [Documents]
      summary: Get document by ID
      operationId: getDocument
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - $ref: '#/components/parameters/DocumentIdPath'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse_Document'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Documents]
      summary: Delete a document
      operationId: deleteDocument
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - $ref: '#/components/parameters/DocumentIdPath'
      responses:
        '204':
          description: Document deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Chunks ────────────────────────────────────────────────────────────────
  /datasets/{datasetId}/documents/{documentId}/chunks:
    get:
      tags: [Chunks]
      summary: List chunks of a parsed document
      operationId: listChunks
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - $ref: '#/components/parameters/DocumentIdPath'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse_ChunkListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Chunks]
      summary: Update a chunk's content
      operationId: updateChunk
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - $ref: '#/components/parameters/DocumentIdPath'
        - name: chunkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChunkUpdate'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse_Chunk'

  /datasets/{datasetId}/documents/{documentId}/chunks/rebuild:
    post:
      tags: [Chunks]
      summary: Trigger chunk rebuild (re-parse) with new parameters
      operationId: rebuildChunks
      parameters:
        - $ref: '#/components/parameters/DatasetIdPath'
        - $ref: '#/components/parameters/DocumentIdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChunkRebuildOptions'
      responses:
        '200':
          description: Rebuild triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_RebuildResult'

  # ── Retrieval ─────────────────────────────────────────────────────────────
  /retrieval:
    post:
      tags: [Retrieval]
      summary: Retrieve knowledge from datasets
      description: |
        Search across datasets using hybrid retrieval (vector + keyword + re-ranking).
        Returns relevant document chunks with similarity scores and source attribution.
      operationId: retrieve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrievalRequest'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse_RetrievalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ── Chat ──────────────────────────────────────────────────────────────────
  /chats:
    get:
      tags: [Chat]
      summary: List chat assistants
      operationId: listChats
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse_ChatListResponse'
    post:
      tags: [Chat]
      summary: Create a chat assistant
      operationId: createChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCreate'
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse_ChatAssistant'

  /chats/{chatId}:
    get:
      tags: [Chat]
      summary: Get chat assistant
      operationId: getChat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse_ChatAssistant'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Chat]
      summary: Delete chat assistant
      operationId: deleteChat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Chat deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /chats/{chatId}/sessions:
    get:
      tags: [Chat]
      summary: List sessions for a chat
      operationId: listSessions
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse_SessionListResponse'
    post:
      tags: [Chat]
      summary: Create a new session
      operationId: createSession
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse_Session'

  /chats/{chatId}/completion:
    post:
      tags: [Chat]
      summary: Stream chat completion (SSE)
      description: |
        Sends a question and streams back the LLM response as Server-Sent Events.

        SSE stream format (newline-delimited JSON):
        ```
        event: message
        data: {"type":"delta","content":"Hello","sessionId":"abc"}

        event: done
        data: {}
        ```

        Set `stream: false` in the request body for a non-streaming response.
      operationId: chatCompletion
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Streaming response (SSE)
          content:
            application/x-ndjson:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'

  /chats/{chatId}/sessions/{sessionId}/messages:
    get:
      tags: [Chat]
      summary: List messages in a session
      operationId: listMessages
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse_MessageListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── API Keys ──────────────────────────────────────────────────────────────
  /apikeys:
    get:
      tags: [API Keys]
      summary: List API keys
      operationId: listApiKeys
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse_ApiKeyListResponse'
    post:
      tags: [API Keys]
      summary: Create API key
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse_ApiKeyCreated'

  /apikeys/{keyId}:
    delete:
      tags: [API Keys]
      summary: Revoke API key
      operationId: deleteApiKey
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: API key revoked
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Account ──────────────────────────────────────────────────────────────
  /account:
    get:
      tags: [Account]
      summary: Get current user
      description: Returns the authenticated user (from Authorization header or session)
      operationId: getAccount
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse_CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Team ─────────────────────────────────────────────────────────────────
  /team/members:
    get:
      tags: [Team]
      summary: List team members
      operationId: listTeamMembers
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse_TeamMemberListResponse'
    post:
      tags: [Team]
      summary: Invite team member
      operationId: inviteTeamMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInvite'
      responses:
        '501':
          description: Not yet implemented (RAGFlow UI-based user management)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Usage ────────────────────────────────────────────────────────────────
  /usage:
    get:
      tags: [Usage]
      summary: Get usage statistics
      operationId: getUsage
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse_UsageStats'

# ── Components ────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: RAGFlow API key (Bearer token)

  parameters:
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeQuery:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DatasetIdPath:
      name: datasetId
      in: path
      required: true
      schema:
        type: string
    DocumentIdPath:
      name: documentId
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_Null'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_Null'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_Error'

    ApiResponse_HealthStatus:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_HealthStatus'
    ApiResponse_Dataset:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_Dataset'
    ApiResponse_DatasetListResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_DatasetListResponse'
    ApiResponse_Document:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_Document'
    ApiResponse_DocumentListResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_DocumentListResponse'
    ApiResponse_Chunk:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_Chunk'
    ApiResponse_ChunkListResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_ChunkListResponse'
    ApiResponse_RebuildResult:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_RebuildResult'
    ApiResponse_RetrievalResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_RetrievalResponse'
    ApiResponse_ChatListResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_ChatListResponse'
    ApiResponse_ChatAssistant:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_ChatAssistant'
    ApiResponse_SessionListResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_SessionListResponse'
    ApiResponse_Session:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_Session'
    ApiResponse_MessageListResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_MessageListResponse'
    ApiResponse_ApiKeyListResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_ApiKeyListResponse'
    ApiResponse_ApiKeyCreated:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_ApiKeyCreated'
    ApiResponse_CurrentUser:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_CurrentUser'
    ApiResponse_TeamMemberListResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_TeamMemberListResponse'
    ApiResponse_UsageStats:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_UsageStats'
    ApiResponse_Null:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_Null'
    ApiResponse_Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse_Error'

  # ── Schemas ────────────────────────────────────────────────────────────────

  schemas:
    # ── ApiResponse wrapper ───────────────────────────────────────────────
    ApiResponse_HealthStatus:
      $ref: '#/components/schemas/ApiResponse_HealthStatus'
    ApiResponse_Dataset:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Dataset'
    ApiResponse_DatasetListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DatasetListResponse'
    ApiResponse_Document:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Document'
    ApiResponse_DocumentListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DocumentListResponse'
    ApiResponse_Chunk:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Chunk'
    ApiResponse_ChunkListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              type: object
              properties:
                chunks:
                  type: array
                  items:
                    $ref: '#/components/schemas/Chunk'
                total:
                  type: integer
    ApiResponse_RebuildResult:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                  enum: [triggered]
    ApiResponse_RetrievalResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RetrievalResponse'
    ApiResponse_ChatListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              type: object
              properties:
                chats:
                  type: array
                  items:
                    type: object
                total:
                  type: integer
    ApiResponse_ChatAssistant:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              type: object
    ApiResponse_SessionListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              type: object
              properties:
                sessions:
                  type: array
                  items:
                    type: object
                total:
                  type: integer
    ApiResponse_Session:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              type: object
    ApiResponse_MessageListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ChatMessage'
    ApiResponse_ApiKeyListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
    ApiResponse_ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              type: object
              properties:
                api_key_id:
                  type: string
                api_key:
                  type: string
                name:
                  type: string
    ApiResponse_CurrentUser:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CurrentUser'
    ApiResponse_TeamMemberListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TeamMember'
    ApiResponse_UsageStats:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UsageStats'
    ApiResponse_Null:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              type: string
              enum: [null]
    ApiResponse_Error:
      allOf:
        - $ref: '#/components/schemas/ApiResponse_Wrapper'
        - type: object
          properties:
            data:
              type: string
              enum: [null]
            message:
              type: string

    ApiResponse_Wrapper:
      type: object
      required: [code, data, request_id, timestamp]
      properties:
        code:
          type: integer
          description: 0 = success, non-zero = error
        data:
          description: Response payload (null on error)
        request_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time

    # ── Domain schemas ───────────────────────────────────────────────────

    HealthStatus:
      type: object
      required: [status, adapter, version]
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
        adapter:
          type: string
          enum: [mock, ragflow]
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        detail:
          type: string

    Dataset:
      type: object
      required: [id, name, documentCount, chunkCount, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        documentCount:
          type: integer
        chunkCount:
          type: integer
        embeddingModel:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DatasetCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 512
        embedding_model:
          type: string

    DatasetListResponse:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    Document:
      type: object
      required: [id, datasetId, name, status, createdAt]
      properties:
        id:
          type: string
        datasetId:
          type: string
        name:
          type: string
        size:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, parsing, ready, error]
        chunkCount:
