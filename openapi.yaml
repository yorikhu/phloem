          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalChunk'
        createdAt:
          type: string
          format: date-time

    SessionCreate:
      type: object
      properties:
        session_id:
          type: string
          description: Optional client-provided session ID

    CurrentUser:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, admin, member]
